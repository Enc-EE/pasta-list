services:
  app:
    image: ghcr.io/enc-ee/pasta-list:2026-09-20
    secrets:
      - connection_string
      - code_hash_key
      - email_password
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PastaList_File: /run/secrets/connection_string
      Auth__CodeHashKey_File: /run/secrets/code_hash_key
      Email__Host: ${PASTA_LIST_SMTP_HOST:?set PASTA_LIST_SMTP_HOST}
      Email__Port: ${PASTA_LIST_SMTP_PORT:-587}
      Email__User: ${PASTA_LIST_SMTP_USER:?set PASTA_LIST_SMTP_USER}
      Email__Password_File: /run/secrets/email_password
      Email__From: ${PASTA_LIST_SMTP_FROM:?set PASTA_LIST_SMTP_FROM}
      DataProtection__KeysPath: /var/lib/pasta-list/keys
    volumes:
      - pastalist-keys:/var/lib/pasta-list/keys
    ports:
      - "127.0.0.1:31002:8080"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100

secrets:
  connection_string:
    external: true
  code_hash_key:
    external: true
  email_password:
    external: true

volumes:
  pastalist-keys:
