services:
  app:
    image: ${PASTA_LIST_IMAGE:?set PASTA_LIST_IMAGE}
    container_name: pastalist-app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PastaList: ${PASTA_LIST_CONNECTION_STRING:?set PASTA_LIST_CONNECTION_STRING}
      Auth__CodeHashKey: ${PASTA_LIST_CODE_HASH_KEY:?set PASTA_LIST_CODE_HASH_KEY}
      Email__Host: ${PASTA_LIST_SMTP_HOST:?set PASTA_LIST_SMTP_HOST}
      Email__Port: ${PASTA_LIST_SMTP_PORT:-587}
      Email__User: ${PASTA_LIST_SMTP_USER:?set PASTA_LIST_SMTP_USER}
      Email__Password: ${PASTA_LIST_SMTP_PASSWORD:?set PASTA_LIST_SMTP_PASSWORD}
      Email__From: ${PASTA_LIST_SMTP_FROM:?set PASTA_LIST_SMTP_FROM}
      DataProtection__KeysPath: /var/lib/pasta-list/keys
    volumes:
      - pastalist-keys:/var/lib/pasta-list/keys
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  pastalist-keys:
