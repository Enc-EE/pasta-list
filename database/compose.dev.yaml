services:
  db:
    image: docker.io/library/postgres:18-trixie
    environment:
      POSTGRES_DB: pastalist
      POSTGRES_USER: pastalist
      POSTGRES_PASSWORD: pastalist_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pastalist-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastalist -d pastalist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pastalist-data:
