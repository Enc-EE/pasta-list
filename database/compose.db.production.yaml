services:
  db:
    image: docker.io/library/postgres:18-trixie
    secrets:
      - db_password
    environment:
      POSTGRES_DB: pastalist
      POSTGRES_USER: pastalist
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pastalist-data:/var/lib/postgresql/data
    networks:
      pastalist-net:
        aliases:
          - db
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastalist -d pastalist"]
      interval: 5s
      timeout: 5s
      retries: 10

secrets:
  db_password:
    external: true

volumes:
  pastalist-data:

networks:
  pastalist-net:
    name: pastalist-net
    external: true
